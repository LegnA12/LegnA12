name: Actualizar racha de contribuciones

on:
  schedule:
    - cron: "0 3 * * *" # todos los dias a las 03:00 UTC
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  generar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generar SVG de racha
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=LegnA12&theme=dark&hide_border=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commitear SVG actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Actualizar racha de contribuciones" || exit 0
          git push
